<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ResearchForge — traceable research from the command line</title>
  <desc id="desc">ResearchForge turns scholarly searches into normalized records, visible failures, citations, and replayable review packages. A real tracked run shows six queries, four sources, 280 records, and 237 deduplicated records.</desc>

  <rect width="1200" height="420" rx="24" fill="#0B0D10"/>
  <path d="M54 374H1146" stroke="#293039"/>
  <path d="M692 42V334" stroke="#293039"/>

  <g id="identity" transform="translate(58 50)">
    <text x="0" y="0" fill="#FF6B35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2.2">LOCAL-FIRST RESEARCH CLI</text>
    <text x="0" y="82" fill="#F7F3EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="760" letter-spacing="-3">ResearchForge</text>
    <text x="0" y="132" fill="#F7F3EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600">Search broadly. Keep the evidence trail.</text>
    <text x="0" y="176" fill="#9AA5B1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Scholarly discovery, normalized records, legal open access,</text>
    <text x="0" y="204" fill="#9AA5B1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">citations, and replayable reviews — without a hosted black box.</text>

    <g transform="translate(0 246)">
      <rect width="152" height="36" rx="18" fill="#151A20" stroke="#323A44"/>
      <text x="20" y="23" fill="#E3E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">44 CONNECTORS</text>
      <rect x="164" width="148" height="36" rx="18" fill="#151A20" stroke="#323A44"/>
      <text x="184" y="23" fill="#E3E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">GO + SQLITE</text>
      <rect x="324" width="128" height="36" rx="18" fill="#151A20" stroke="#323A44"/>
      <text x="348" y="23" fill="#E3E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">MIT LICENSE</text>
    </g>
  </g>

  <g id="receipt" transform="translate(732 42)">
    <rect width="414" height="292" rx="16" fill="#12171D" stroke="#343D48"/>
    <text x="24" y="34" fill="#8995A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.6">TRACKED RUN / DISCOVERY RECEIPT</text>
    <path d="M24 51H390" stroke="#343D48"/>

    <g transform="translate(24 78)">
      <text x="0" y="0" fill="#FF6B35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="760">6</text>
      <text x="0" y="24" fill="#8995A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">QUERIES</text>
      <text x="90" y="0" fill="#FF6B35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="760">4</text>
      <text x="90" y="24" fill="#8995A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SOURCES</text>
      <text x="180" y="0" fill="#F7F3EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="760">280</text>
      <text x="180" y="24" fill="#8995A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">RECORDS</text>
      <text x="286" y="0" fill="#F7F3EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="760">237</text>
      <text x="286" y="24" fill="#8995A2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">UNIQUE</text>
    </g>

    <g transform="translate(24 144)">
      <path d="M8 0V84" stroke="#FF6B35" stroke-width="2"/>
      <circle cx="8" cy="4" r="4" fill="#FF6B35"/>
      <circle cx="8" cy="44" r="4" fill="#12171D" stroke="#788491" stroke-width="2"/>
      <circle cx="8" cy="84" r="4" fill="#12171D" stroke="#788491" stroke-width="2"/>
      <text x="28" y="9" fill="#F7F3EA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">manifest.json</text>
      <text x="28" y="27" fill="#788491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">exact queries, sources, counts</text>
      <text x="28" y="49" fill="#F7F3EA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">results-deduped.jsonl</text>
      <text x="28" y="67" fill="#788491" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">normalized identities, ready to inspect</text>
      <text x="28" y="89" fill="#F7F3EA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">failures.jsonl</text>
      <text x="28" y="107" fill="#FF9A73" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">10 failures preserved for deliberate retry</text>
    </g>

    <text x="24" y="270" fill="#66717D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">research/open-source-project-search/manifest.json</text>
  </g>

  <g id="footer" transform="translate(58 398)">
    <text x="0" y="0" fill="#73808C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">RETRIEVE / NORMALIZE / VERIFY / CITE / REPLAY</text>
    <text x="1088" y="0" text-anchor="end" fill="#FF6B35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">HUMAN GATES STAY HUMAN</text>
  </g>
</svg>
